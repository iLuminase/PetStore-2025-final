spring:
  application:
    name: product-api

  # Connection Pool Optimization
  datasource:
    url: ${MSSQL_STORE_JDBC:jdbc:sqlserver://phatdevio-dbserver.database.windows.net:1433;database=phatdevio-db;user=admindb@phatdevio-dbserver;password=password123!;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30}
    username: ${MSSQL_STORE_USER:admindb@phatdevio-dbserver}
    password: ${MSSQL_STORE_PASSWORD:password123!}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        "[format_sql]": false
        "[use_sql_comments]": false
        # Performance optimizations
        jdbc:
          "[batch_size]": 20
          "[batch_versioned_data]": true
        "[order_inserts]": true
        "[order_updates]": true
        connection:
          "[provider_disables_autocommit]": true
        cache:
          "[use_second_level_cache]": false
          "[use_query_cache]": false

server:
  port: 8082

logging:
  level:
    "[com.product_api]": WARN
    "[org.springframework.web]": ERROR
    "[org.hibernate.SQL]": ERROR
    "[org.hibernate.type.descriptor.sql]": ERROR
    root: ERROR
  pattern:
    console: "%d{HH:mm:ss} %-5level %logger{20} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
