server:
  port: 8080

jwt:
  secret: mySecretKeyForJWTTokenThatNeedsToBeAtLeast256BitsLongForHS256Algorithm
  expiration: 86400000

auth-service:
  url: http://localhost:8090

product-service:
  url: http://localhost:8082

cart-service:
  url: http://localhost:8083

spring:
  application:
    name: api-gateway
  datasource:
    url: ${MSSQL_STORE_JDBC:jdbc:sqlserver://phatdevio-dbserver.database.windows.net:1433;database=phatdevio-db;user=admindb@phatdevio-dbserver;password=password123!;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30}
    username: ${MSSQL_STORE_USER:admindb@phatdevio-dbserver}
    password: ${MSSQL_STORE_PASSWORD:password123!}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.SQLServerDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        corsConfigurations:
          "[/**]":
            allowedOrigins:
              - "http://localhost:4200"
              - "http://localhost:4201"
              - "http://localhost:4202"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      routes:
        - id: auth-service
          uri: http://localhost:8090
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

        - id: product-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/products/**
          filters:
            - StripPrefix=1

        - id: cart-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/carts/**
          filters:
            - StripPrefix=1
