server:
  port: 8090

spring:
  application:
    name: auth-api

  # Database Configuration - SystemDB for users/auth
  datasource:
    url: jdbc:mysql://localhost:3306/system-db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:admin123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:mySecretKeyForJWTTokenThatNeedsToBeAtLeast256BitsLongForHS256Algorithm}
  issuer: https://auth-api.petstore.local
  access-token:
    expiration: 900 # 15 minutes in seconds
  refresh-token:
    expiration: 2592000 # 30 days in seconds

# Google OAuth Configuration
google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    # Must match EXACTLY with Google Console Authorized redirect URIs
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:4200/auth/callback}

# Logging
logging:
  level:
    com.auth_api: DEBUG
    org.springframework.security: DEBUG
