version: "3.8"

services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    ports:
      - "9090:8080"
    environment:
      # Admin credentials
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      # Database configuration for Azure SQL
      KC_DB: mssql
      KC_DB_URL: "jdbc:sqlserver://keycloak-sqlserver.database.windows.net:1433;database=keycloakdb;user=keycloakadmin@keycloak-sqlserver;password=123qwe!@#;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30"
      KC_DB_USERNAME: "keycloakadmin@keycloak-sqlserver"
      KC_DB_PASSWORD: "123qwe!@#"

      # Keycloak configuration
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true

    command:
      - start-dev
      - --import-realm

    volumes:
      - ./keycloak-data:/opt/keycloak/data/import

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
